[Mod]
Name=Window Rescue
Version=1.10
Author=Zurnny
Group=
Description=In the Add-ons window (the Add-ons button in the menu), under Map & Windows: a "Bring all windows on screen" button that moves any window sitting partly or fully off screen back into view.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Fixes a freeze when ticking a Dropped Items box in the Add-ons window. New: Group Leader colour in Message Colours; Minimap Window's compass ring with its own switch and map turning; Weapon Refresh merged into HUD Weapon Slot; the default UI Add-ons button uses the game's own button look.
Priority=5
