Description=Options > UI > Windows: a "Bring all windows on screen" button that moves any window sitting partly or fully off screen back into view.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Works with the default UI and the Steampunk UI theme: each window checks which one is installed and uses its look (no launcher needed).
Priority=5
